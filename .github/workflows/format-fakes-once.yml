name: Format Fakes Once

on:
  push:
    branches:
      - feat/kedis-categories
    paths:
      - test/support/fake_repositories.dart
      - .github/workflows/format-fakes-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/kedis-categories

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Dart formatter
        run: dart format test/support/fake_repositories.dart

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/support/fake_repositories.dart
          git commit -m "style(tests): apply canonical Dart formatting"
          git push origin HEAD:feat/kedis-categories
