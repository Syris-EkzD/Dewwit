schema_version = 1

[project]
name = "Dewwit"

[sources]
paths = [
  "AGENTS.md",
  "lib/main.dart",
  "lib/repositories/task_repository.dart",
  "test/widget_test.dart",
]

[scope]
include = [
  "lib/main.dart",
  "test/widget_test.dart",
]

exclude = []

constraints = [
  "When saving an edited task, compare the trimmed edited title with the task's existing title.",
  "If the trimmed title is unchanged, exit editing without calling TaskRepository.updateTaskTitle, refreshing the Android widget, or performing the normal mutation reload.",
  "A genuinely changed non-empty title must continue using the existing persistence, widget-refresh, and task-reload behavior.",
  "Existing empty-title validation and editing behavior must remain unchanged.",
  "Do not change TaskRepository persistence semantics for this task.",
  "Do not add dependencies or broaden Dewwit product scope.",
]

[authority]
may = [
  "Adjust the task-title save flow in lib/main.dart to skip a no-op edit.",
  "Add or update focused widget tests in test/widget_test.dart.",
]

requires_approval = [
  "Changing task persistence behavior beyond skipping an unchanged title save.",
  "Changing Android widget synchronization behavior outside the unchanged-title case.",
  "Changing public product behavior beyond this no-op edit optimization.",
]

may_not = [
  "Modify lib/repositories/task_repository.dart.",
  "Modify pubspec.yaml or pubspec.lock.",
  "Modify Android native widget code.",
  "Add dependencies.",
  "Refactor unrelated task, theme, settings, or widget behavior.",
]

[session]
max_commits = 2

[acceptance]
criteria = [
  "Saving a task title whose trimmed value equals the existing title exits editing successfully without persisting an update.",
  "An unchanged-title save does not invoke the Android widget refresh callback.",
  "A genuinely changed non-empty task title still persists and refreshes the widget normally.",
  "Existing empty-title validation remains intact.",
  "Focused regression coverage proves the unchanged-title no-op behavior.",
  "All configured verification passes.",
]

[verification]

[[verification.steps]]
name = "format"
command = ["dart", "format", "--output=none", "--set-exit-if-changed", "lib", "test"]
cwd = "."

[[verification.steps]]
name = "analyze"
command = ["flutter", "analyze"]
cwd = "."

[[verification.steps]]
name = "tests"
command = ["flutter", "test"]
cwd = "."
